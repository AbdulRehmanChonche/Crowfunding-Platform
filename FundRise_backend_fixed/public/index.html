<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FundRise – Explore Campaigns</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
    :root { --sky:#87CEEB; --green:#2ecc71; --green-dark:#27ae60; --text:#2c3e50; --muted:#7f8c8d; --bg:#f4f8fb; --card:#fff; --accent:#3498db; --warn:#e67e22; --danger:#e74c3c; }
    body { font-family:'DM Sans',sans-serif; background:var(--bg); color:var(--text); min-height:100vh; }
    nav { background:linear-gradient(135deg,#87CEEB,#74b9e8); padding:0 24px; height:64px; display:flex; align-items:center; justify-content:space-between; position:sticky; top:0; z-index:100; box-shadow:0 2px 16px rgba(0,0,0,.1); }
    .nav-brand { font-family:'Playfair Display',serif; font-size:22px; color:var(--green-dark); display:flex; align-items:center; gap:8px; text-decoration:none; }
    .nav-actions { display:flex; align-items:center; gap:12px; }
    .nav-btn { padding:8px 18px; border-radius:24px; font-size:13px; font-weight:600; cursor:pointer; border:none; font-family:'DM Sans',sans-serif; transition:all .2s; text-decoration:none; display:inline-block; }
    .nav-btn.outline { background:transparent; border:2px solid white; color:white; }
    .nav-btn.outline:hover { background:white; color:var(--green-dark); }
    .nav-btn.solid { background:var(--green); color:white; box-shadow:0 2px 10px rgba(46,204,113,.3); }
    .nav-btn.solid:hover { background:var(--green-dark); transform:translateY(-1px); }
    .nav-btn.dashboard { background:rgba(255,255,255,.2); border:2px solid white; color:white; }
    .nav-btn.dashboard:hover { background:white; color:var(--green-dark); }
    .nav-user { font-size:13px; color:rgba(255,255,255,.9); }
    .hero { background:linear-gradient(135deg,#87CEEB 0%,#b8e4f7 60%,#74b9e8 100%); padding:60px 24px 70px; text-align:center; position:relative; overflow:hidden; }
    .hero::after { content:''; position:absolute; bottom:-30px; left:0; right:0; height:60px; background:var(--bg); border-radius:50% 50% 0 0 / 60px 60px 0 0; }
    .hero h1 { font-family:'Playfair Display',serif; font-size:clamp(28px,5vw,48px); color:var(--green-dark); margin-bottom:12px; }
    .hero p { font-size:16px; color:var(--text); opacity:.8; max-width:500px; margin:0 auto 28px; line-height:1.6; }
    .hero-stats { display:flex; justify-content:center; gap:32px; flex-wrap:wrap; }
    .stat { text-align:center; }
    .stat-num { font-family:'Playfair Display',serif; font-size:28px; color:var(--green-dark); font-weight:800; }
    .stat-label { font-size:12px; color:var(--muted); font-weight:500; }
    .filters { padding:24px; display:flex; align-items:center; gap:12px; flex-wrap:wrap; max-width:1100px; margin:0 auto; }
    .filter-chip { padding:8px 18px; border-radius:24px; border:2px solid #dde3e8; background:white; font-size:13px; font-weight:600; cursor:pointer; transition:all .2s; color:var(--muted); }
    .filter-chip:hover, .filter-chip.active { border-color:var(--green); color:var(--green-dark); background:rgba(46,204,113,.08); }
    .search-box { margin-left:auto; display:flex; align-items:center; background:white; border:2px solid #dde3e8; border-radius:24px; padding:0 14px; gap:8px; }
    .search-box input { border:none; outline:none; font-family:'DM Sans',sans-serif; font-size:13px; color:var(--text); width:180px; height:38px; background:transparent; }
    .campaigns-grid { max-width:1100px; margin:0 auto; display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:24px; padding:0 24px 60px; }
    .card { background:white; border-radius:20px; overflow:hidden; box-shadow:0 4px 20px rgba(0,0,0,.07); transition:transform .25s,box-shadow .25s; cursor:pointer; }
    .card:hover { transform:translateY(-6px); box-shadow:0 12px 40px rgba(0,0,0,.12); }
    .card-img { height:180px; display:flex; align-items:center; justify-content:center; font-size:64px; position:relative; }
    .badge { position:absolute; top:12px; right:12px; background:white; border-radius:20px; padding:4px 12px; font-size:11px; font-weight:700; color:var(--text); box-shadow:0 2px 8px rgba(0,0,0,.1); }
    .badge.urgent { color:var(--danger); } .badge.trending { color:var(--warn); } .badge.new { color:var(--accent); }
    .card-body { padding:18px; }
    .card-category { font-size:11px; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:.5px; margin-bottom:6px; }
    .card-title { font-family:'Playfair Display',serif; font-size:17px; color:var(--text); margin-bottom:8px; line-height:1.3; }
    .card-desc { font-size:13px; color:var(--muted); line-height:1.5; margin-bottom:14px; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
    .progress-wrap { margin-bottom:12px; }
    .progress-bar { height:7px; background:#eee; border-radius:4px; overflow:hidden; margin:6px 0; }
    .progress-fill { height:100%; border-radius:4px; background:linear-gradient(90deg,var(--green),var(--green-dark)); transition:width 1s ease; }
    .progress-stats { display:flex; justify-content:space-between; font-size:12px; }
    .progress-raised { font-weight:700; color:var(--green-dark); }
    .progress-goal { color:var(--muted); }
    .card-footer { display:flex; align-items:center; justify-content:space-between; }
    .days-left { font-size:12px; color:var(--muted); }
    .days-left span { font-weight:700; color:var(--text); }
    .donate-btn { padding:8px 20px; border-radius:24px; background:linear-gradient(135deg,var(--green),var(--green-dark)); color:white; font-size:13px; font-weight:700; border:none; cursor:pointer; font-family:'DM Sans',sans-serif; box-shadow:0 3px 10px rgba(46,204,113,.3); transition:transform .15s,box-shadow .15s; }
    .donate-btn:hover { transform:translateY(-2px); box-shadow:0 6px 16px rgba(46,204,113,.4); }
    .loading { grid-column:1/-1; text-align:center; padding:60px 0; color:var(--muted); font-size:16px; }
    .spinner { width:40px; height:40px; border:4px solid #dde3e8; border-top-color:var(--green); border-radius:50%; animation:spin .8s linear infinite; margin:0 auto 16px; }
    @keyframes spin { to { transform:rotate(360deg); } }
    .toast { position:fixed; bottom:30px; left:50%; transform:translateX(-50%) translateY(80px); background:#2c3e50; color:white; padding:12px 28px; border-radius:30px; font-size:14px; font-weight:500; transition:transform .3s; z-index:999; white-space:nowrap; }
    .toast.show { transform:translateX(-50%) translateY(0); }
    .toast.success { background:var(--green-dark); }
    @media(max-width:600px) { .hero{padding:40px 16px 60px;} .hero-stats{gap:20px;} .campaigns-grid{grid-template-columns:1fr;padding:0 16px 40px;} .filters{padding:16px;} .search-box input{width:120px;} }
  </style>
</head>
<body>

<nav>
  <a class="nav-brand" href="index.html">🌱 FundRise</a>
  <div class="nav-actions">
    <span class="nav-user" id="nav-user"></span>
    <!-- FIX #3: Show Start Campaign only for Campaign creators; show Dashboard button for creators -->
    <a class="nav-btn dashboard" id="dashboardBtn" href="creator-dashboard.html" style="display:none">📊 My Dashboard</a>
    <a class="nav-btn solid" id="startCampaignBtn" href="create-campaign.html" style="display:none">+ Start Campaign</a>
    <a class="nav-btn outline" href="login.html" onclick="logout()">Logout</a>
  </div>
</nav>

<section class="hero">
  <h1>Fund the Future 🌍</h1>
  <p>Discover campaigns making real impact. Every rupee counts — join thousands of donors changing lives.</p>
  <div class="hero-stats">
    <div class="stat"><div class="stat-num" id="stat-raised">₹—</div><div class="stat-label">Raised total</div></div>
    <div class="stat"><div class="stat-num" id="stat-campaigns">—</div><div class="stat-label">Active campaigns</div></div>
    <div class="stat"><div class="stat-num" id="stat-donors">—</div><div class="stat-label">Donors</div></div>
    <div class="stat"><div class="stat-num">94%</div><div class="stat-label">Success rate</div></div>
  </div>
</section>

<div class="filters">
  <button class="filter-chip active" onclick="filterCampaigns('all',this)">All</button>
  <button class="filter-chip" onclick="filterCampaigns('Education',this)">📚 Education</button>
  <button class="filter-chip" onclick="filterCampaigns('Health',this)">🏥 Health</button>
  <button class="filter-chip" onclick="filterCampaigns('Environment',this)">🌿 Environment</button>
  <button class="filter-chip" onclick="filterCampaigns('Community',this)">🤝 Community</button>
  <button class="filter-chip" onclick="filterCampaigns('Tech',this)">💻 Tech</button>
  <div class="search-box">
    <span>🔍</span>
    <input type="text" id="searchInput" placeholder="Search campaigns…" oninput="applyFilters()">
  </div>
</div>

<div class="campaigns-grid" id="campaignsGrid">
  <div class="loading"><div class="spinner"></div>Loading campaigns…</div>
</div>

<div class="toast" id="toast"></div>

<script>
  const API  = 'http://localhost:3000/api';
  const role = localStorage.getItem('fundrise_role');
  const user = localStorage.getItem('fundrise_user');
  if (!role) window.location.href = 'login.html';

  document.getElementById('nav-user').textContent = user ? `Hi, ${user} 👋` : '';

  // FIX #3: Role-based nav buttons
  if (role === 'Campaign') {
    document.getElementById('startCampaignBtn').style.display = 'inline-block';
    document.getElementById('dashboardBtn').style.display     = 'inline-block';
  } else if (role === 'Admin') {
    // Admin gets neither; they go to admin.html
  }
  // Donors see neither button — they can only donate

  function logout() { localStorage.clear(); }

  let allCampaigns = [];
  let activeFilter = 'all';

  async function loadStats() {
    try {
      const res  = await fetch(`${API}/stats`);
      const data = await res.json();
      if (data.success) {
        const s = data.stats;
        document.getElementById('stat-raised').textContent    = '₹' + Number(s.totalRaised).toLocaleString('en-IN');
        document.getElementById('stat-campaigns').textContent = s.totalCampaigns;
        document.getElementById('stat-donors').textContent    = s.totalDonors + '+';
      }
    } catch (e) {}
  }

  async function loadCampaigns() {
    try {
      const res  = await fetch(`${API}/campaigns`);
      const data = await res.json();
      if (data.success) {
        allCampaigns = data.campaigns;
        renderCampaigns(allCampaigns);
      } else {
        document.getElementById('campaignsGrid').innerHTML = '<div class="loading">Failed to load campaigns.</div>';
      }
    } catch (e) {
      document.getElementById('campaignsGrid').innerHTML = '<div class="loading">⚠️ Cannot connect to server.</div>';
    }
  }

  function renderCampaigns(list) {
    const grid = document.getElementById('campaignsGrid');
    if (!list.length) { grid.innerHTML = '<div class="loading">😕 No campaigns found.</div>'; return; }
    grid.innerHTML = list.map(c => {
      const pct = Math.min(100, Math.round(c.raised / c.goal * 100));
      const badgeHtml = c.badge ? `<span class="badge ${c.badge}">${c.badge==='urgent'?'🔥 Urgent':c.badge==='trending'?'📈 Trending':'✨ New'}</span>` : '';
      // Donors see "Donate" btn; creators see "View"
      const btnLabel = (role === 'Donor') ? 'Donate 💚' : 'View';
      return `
      <div class="card" onclick="window.location.href='campaign.html?id=${c.id}'">
        <div class="card-img" style="background:${c.color}">${c.emoji}${badgeHtml}</div>
        <div class="card-body">
          <div class="card-category">${c.category}</div>
          <div class="card-title">${c.title}</div>
          <div class="card-desc">${c.short_desc}</div>
          <div class="progress-wrap">
            <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
            <div class="progress-stats">
              <span class="progress-raised">₹${Number(c.raised).toLocaleString('en-IN')} raised</span>
              <span class="progress-goal">${pct}% of ₹${Number(c.goal).toLocaleString('en-IN')}</span>
            </div>
          </div>
          <div class="card-footer">
            <div class="days-left"><span>${c.days_left}</span> days left</div>
            <button class="donate-btn" onclick="event.stopPropagation();window.location.href='campaign.html?id=${c.id}'">${btnLabel}</button>
          </div>
        </div>
      </div>`;
    }).join('');
  }

  function filterCampaigns(cat, el) {
    document.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
    el.classList.add('active');
    activeFilter = cat;
    applyFilters();
  }

  function applyFilters() {
    const q = document.getElementById('searchInput').value.toLowerCase();
    let list = allCampaigns;
    if (activeFilter !== 'all') list = list.filter(c => c.category === activeFilter);
    if (q) list = list.filter(c => c.title.toLowerCase().includes(q) || c.short_desc.toLowerCase().includes(q));
    renderCampaigns(list);
  }

  function showToast(msg, type='') {
    const t = document.getElementById('toast');
    t.textContent = msg; t.className = 'toast ' + type + ' show';
    setTimeout(() => t.classList.remove('show'), 2500);
  }

  loadStats();
  loadCampaigns();
</script>
</body>
</html>
